# Entorno reproducible del proyecto — crear con:
#   conda env create -f environment.yml
#   conda activate fontibon-pronostico
name: fontibon-pronostico
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - statsmodels>=0.14
  - scikit-learn>=1.3
  - matplotlib>=3.8
  - openpyxl>=3.1
  - requests>=2.31        # para referencias/descargar_referencias.py
  - pypdf>=4.0            # para scripts/00_extraer_kof.py (extraccion de los PDFs)
  - jupyterlab            # opcional, exploración
